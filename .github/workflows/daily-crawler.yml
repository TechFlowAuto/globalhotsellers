name: Daily Crawler (GHS)

on:
  schedule:
    - cron: "25 22 * * *" # 06:25 Asia/Shanghai (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git (script pushes via GITHUB_TOKEN)
        run: |
          git config user.name "TechFlowAuto"
          git config user.email "13991218199@163.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/TechFlowAuto/globalhotsellers.git"

      - name: Run daily crawler
        run: python3 scripts/crawler_daily.py
        timeout-minutes: 45

      - name: Show log tail (always)
        if: always()
        run: |
          echo "--- crawler.log tail ---"
          tail -20 logs/crawler.log 2>/dev/null || echo "(no log)"
          echo "--- git log ---"
          git log --oneline -3 2>/dev/null || true
